(()=>{'use strict';

const A={mode:'home',role:'',room:new URLSearchParams(location.search).get('room')?.toUpperCase()||'',name:localStorage.getItem('fko-name')||'',token:'',peer:null,conn:null,conns:new Map(),game:null,state:null,err:'',choice:null,choiceRound:-1,won:false,offset:0,calibrated:false,qr:false,qrRequested:false,sound:localStorage.getItem('fko-sound')!=='off',wake:null,retryTimer:null};

}

}

}
function snapshot(){let g=A.game;return {phase:g.phase,round:g.round,set:g.set,manual:g.manual,players:g.players.map(p=>({id:p.id,name:p.name,alive:p.alive,online:p.online,answered:p.answer!==null,answer:['reveal','hold','finished'].includes(g.phase)?p.answer:null,wins:g.wins[p.id]||0})),spectators:g.spectators.filter(p=>p.online).map(p=>({id:p.id,name:p.name})),q:g.q?{text:g.q[1],tag:g.q[0],options:g.q[2],correct:['reveal','hold','finished'].includes(g.phase)?g.q[3]:null,pack:g.q[4]}:null,from:g.from,deadline:g.deadline,until:g.until,winner:g.winner,allMiss:g.allMiss,eliminated:g.eliminated,serverNow:Date.now()}}

function share(){if(navigator.share)navigator.share({title:'Football Knockout',text:'Intră în camera mea de fotbal! 5 secunde pe întrebare.',url:url()}).catch(()=>{});else copy()}
function player(p){return '<div class="player '+(!p.alive?'dead':'')+'"><div class="avatar">'+esc(p.name[0].toUpperCase())+'</div><div class="player-name">'+esc(p.name)+(p.id===A.token?' · tu':'')+(p.wins?' <small class="tinywin">🏆 '+p.wins+' victorii</small>':'')+'</div><div class="status">'+(p.alive?'●':'✕')+'</div></div>'}
function setList(g){return '<div class="card"><div class="select-head"><h3>10 SETURI DE ÎNTREBĂRI</h3><span class="pill">100 ÎNTREBĂRI</span></div><p class="muted">Gazda alege o categorie de 10 întrebări sau modul mixt cu toate 100.</p><div class="pack-grid"><button class="pack all '+(g.set==='mix'?'active':'')+'" data-pack="mix" '+(A.role!=='host'?'disabled':'')+'><span class="packemoji">🎲</span><span><span class="packname">ALL-TIME MIX · 100</span><span class="packdetails">Toate temele, în ordine aleatorie</span></span></button>'+PACKS.map(p=>'<button class="pack '+(g.set===p[0]?'active':'')+'" data-pack="'+p[0]+'" '+(A.role!=='host'?'disabled':'')+'><span class="packemoji">'+p[2]+'</span><span class="packname">'+esc(p[1])+'</span><span class="packdetails">10 întrebări · '+esc(p[4])+'</span></button>').join('')+'</div>'+(A.role==='host'?'<label class="toggle"><input id="manual" type="checkbox" '+(g.manual?'checked':'')+'> Pauză între întrebări (continui manual)</label>':'')+'</div>'}
function home(){return '<div class="eyebrow">ULTIMUL RĂMAS CÂȘTIGĂ</div><h1>KNOW IT.<br><span>OR GET<br>KNOCKED OUT.</span></h1><p class="muted">100 de întrebări · 10 seturi · 5 secunde. Greșești sau nu răspunzi? Ești eliminat.</p><div class="hero-art"><div class="ball">⚽</div></div>'+
'<div class="card"><label>NUMELE TĂU</label><input id="name" class="field" placeholder="Ex: Hagi 10" maxlength="18" value="'+esc(A.name)+'"><button class="btn" id="create">＋ CREEAZĂ CAMERĂ</button><div class="divide">SAU INTRĂ LA PRIETENI</div><label>CODUL CAMEREI</label><input id="code" class="field" placeholder="Ex: AB72CD" maxlength="6" value="'+esc(A.room)+'"><button class="btn alt" id="join">INTRĂ CU COD →</button></div><p class="muted" style="text-align:center">2–10 jucători · Fără cont · Cod, link sau QR · Gazda ține pagina deschisă</p>'}
function lobby(g){return '<div style="text-align:center"><div class="eyebrow">CAMERA ESTE PREGĂTITĂ</div><h2>ADUNĂ-ȚI <span>ECHIPA.</span></h2><p class="muted">Trimite linkul prietenilor. Fiecare intră de pe telefon.</p><div class="roomcode">'+esc(A.room)+'</div><div class="btn-row"><button class="btn" id="copy">⧉ COPIAZĂ LINK</button><button class="btn alt" id="share">↗ TRIMITE LINK</button></div><div class="link">'+esc(url())+'</div><button class="btn outline" id="qr-open" style="margin-top:9px">▦ AFIȘEAZĂ COD QR</button></div><div class="card"><h3>LA MASĂ <span class="pill" style="float:right">'+g.players.length+'/10</span></h3><div class="players">'+g.players.map(player).join('')+'</div>'+(g.spectators.length?'<p class="spectator">👀 Spectatori: '+g.spectators.map(p=>esc(p.name)).join(', ')+'</p>':'')+'</div>'+setList(g)+(A.role==='host'?'<button id="start" class="btn" '+(g.players.filter(p=>p.online).length<2?'disabled':'')+'>⚡ ÎNCEPE · 5 SECUNDE</button>':'<div class="card muted" style="text-align:center">⏳ Așteptăm ca gazda să înceapă...</div>')+'<p class="compact-note">Dacă mai rămân jucători după 10 întrebări, intră automat întrebări de departajare fără repetări.</p>'}
function game(g){let me=g.players.find(p=>p.id===A.token),alive=g.players.filter(p=>p.alive).length,reveal=['reveal','hold'].includes(g.phase),chosen=me?.answered?me.answer:(A.choiceRound===g.round?A.choice:null),ready=hostNow()>=g.from;
let opts=g.q.options.map((s,i)=>{let cl='answer'+(reveal?(i===g.q.correct?' good':chosen===i?' bad':' dim'):(chosen===i?' sel':''));let disabled=reveal||!me?.alive||me.answered||chosen!==null||!ready;return '<button class="'+cl+'" data-answer="'+i+'" '+(disabled?'disabled':'')+'><span class="letter">'+['A','B','C','D'][i]+'</span>'+esc(s)+(reveal&&i===g.q.correct?' ✓':'')+'</button>'}).join('');
let max=g.set==='mix'?100:10,pack=g.set==='mix'?'ALL-TIME MIX':PACKS.find(p=>p[0]===g.set)?.[1]||'MIX',tie=g.set!=='mix'&&g.round>10,progress=Math.min(100,Math.round(Math.min(g.round,max)/max*100));
return '<div class="meta"><div class="round">RUNDA '+g.round+(tie?' · DEPARTAJARE':'')+'</div><div class="pill">⚽ '+alive+' ÎN JOC</div></div><div class="room-bar"><span class="selectedpack">'+esc(pack)+'</span><span class="muted">'+(tie?'BONUS':Math.min(g.round,max)+' / '+max)+'</span></div><div class="question"><div id="timer" class="clock"><div class="clockinner" id="secs">5</div></div><div class="topic">'+(g.q.tag==='RO'?'🇷🇴 FOTBAL ROMÂNESC':'🌍 FOTBAL INTERNAȚIONAL')+' · '+esc(g.q.pack)+'</div><div class="qtext">'+esc(g.q.text)+'</div><div class="answers">'+opts+'</div><div class="note">'+(reveal?'Răspunsul corect este marcat cu verde.':!me?'Ești spectator. Poți intra la revanșă.':!me.alive?'Ai fost eliminat. Urmărește jocul.':chosen!==null?'Răspuns blocat. Așteaptă verdictul.':'Ai doar 5 secunde!')+'</div>'+(reveal?'<div class="result '+(g.allMiss?'red':'')+'">'+(g.allMiss?'NIMENI NU A NIMERIT — CONTINUĂM':g.eliminated.length?'ELIMINAȚI: '+g.eliminated.map(esc).join(', '):'TOȚI AU RĂSPUNS CORECT')+'</div>':'')+'<div class="progress-line"><div class="progress-fill" style="width:'+progress+'%"></div></div></div>'+(g.phase==='hold'?'<div class="intermission"><h3>PAUZĂ ÎNTRE RUNDE</h3>'+(A.role==='host'?'<button id="next" class="btn">▶ ÎNTREBAREA URMĂTOARE</button>':'<p class="muted">Așteptăm gazda...</p>')+'</div>':'')+'<div class="card"><h3>LA MASĂ</h3><div class="players">'+g.players.map(player).join('')+'</div>'+(g.spectators.length?'<p class="spectator">👀 '+g.spectators.length+' spectatori</p>':'')+'</div>'}
function finished(g){let p=g.players.find(p=>p.id===g.winner),sorted=g.players.slice().sort((a,b)=>Number(b.alive)-Number(a.alive));return '<div class="card winner"><div class="eyebrow">CAMPIONUL SERII</div><div class="trophy">🏆</div><h2><span>KNOCKOUT!</span></h2><div class="winname">'+esc(p?.name||'CAMPIONUL')+'</div><p class="muted">Ultimul rămas după '+g.round+' runde.</p><div class="winner-rank">'+sorted.map((x,i)=>'<div class="rank"><b>'+(['🥇','🥈','🥉'][i]||'#'+(i+1))+'</b><strong>'+esc(x.name)+'</strong><small>'+x.wins+' victorii</small></div>').join('')+'</div>'+(A.role==='host'?'<button class="btn" id="replay">↻ REVANȘĂ</button>':'<p class="muted">Gazda poate porni o revanșă.</p>')+'</div>'}
function sound(f){if(!A.sound)return;try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f||650;g.gain.value=.04;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.07);o.stop(c.currentTime+.07);o.onended=()=>c.close()}catch(e){}}
function hostNow(){return Date.now()+(A.role==='host'?0:A.offset)}
function wake(){try{if(!document.hidden&&navigator.wakeLock&&!A.wake)navigator.wakeLock.request('screen').then(w=>A.wake=w).catch(()=>{})}catch(e){}}
function toggleSound(){A.sound=!A.sound;localStorage.setItem('fko-sound',A.sound?'on':'off');render();if(A.sound)sound(740)}
function full(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()}catch(e){}}
function openQr(){A.qr=!A.qr;render()}
function qrUi(){return A.qr?'<div class="qr-overlay" id="qr-overlay"><div class="qr-panel"><div class="eyebrow">SCANEAZĂ ȘI INTRĂ</div><h3>CAMERA '+esc(A.room)+'</h3><div class="qr-code" id="qr-code"></div><p class="compact-note">Scanează cu camera telefonului.</p><button class="btn alt" id="qr-close">ÎNCHIDE</button></div></div>':''}
function drawQr(){if(!A.qr||!$('qr-code'))return;if(window.QRCode){new QRCode($('qr-code'),{text:url(),width:210,height:210});return}
$('qr-code').textContent='Se încarcă QR...';if(!A.qrRequested){A.qrRequested=true;let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';s.onload=()=>{if(A.qr)render()};s.onerror=()=>{$('qr-code').textContent='QR indisponibil. Trimite linkul.'};document.head.appendChild(s)}}
function render(){let box=$('app');if(A.mode==='loading'){box.innerHTML='<div class="loading">⚽ Se conectează camera...</div>';return}
let html=A.mode==='home'||!A.state?home():A.state.phase==='lobby'?lobby(A.state):A.state.phase==='finished'?finished(A.state):game(A.state);
box.innerHTML=(A.err?'<div class="error">'+esc(A.err)+(A.role==='guest'&&A.mode==='room'?' <button id="reconnect" class="btn alt">RECONECTEAZĂ</button>':'')+'</div>':'')+html+qrUi();
for(let [id,cb] of Object.entries({create:host,join,copy,share,start,replay,next:goNext,'qr-open':openQr,'qr-close':openQr,reconnect:connect})){let b=$(id);if(b)b.onclick=cb}
document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer));document.querySelectorAll('[data-pack]').forEach(b=>b.onclick=()=>setPack(b.dataset.pack));let m=$('manual');if(m)m.onchange=()=>setManual(m.checked);
let s=$('sound');if(s){s.textContent=A.sound?'🔊':'🔇';s.onclick=toggleSound}let f=$('full');if(f)f.onclick=full;
if(A.qr)drawQr();drawClock();
if(A.state?.phase==='finished'&&!A.won){A.won=true;try{navigator.vibrate?.([70,80,70])}catch(e){}}
}
function drawClock(){let g=A.state;if(!g||!['question','reveal','hold'].includes(g.phase))return;let s=g.phase==='question'?Math.max(0,Math.min(5,(g.deadline-Math.max(g.from,hostNow()))/1000)):0;let t=$('secs'),r=$('timer');if(t)t.textContent=g.phase==='question'?Math.ceil(s):'✓';if(r){r.style.background='conic-gradient('+(s<=2?'#ff726c':'#cafa54')+' '+s/5*360+'deg,#42674a 0)';r.classList.toggle('pulse',s>0&&s<=2)}if(g.phase==='question'&&hostNow()>=g.from){document.querySelectorAll('[data-answer]').forEach(b=>{let me=g.players.find(p=>p.id===A.token);b.disabled=!(me?.alive&&!me.answered&&A.choiceRound!==g.round&&hostNow()<g.deadline)})}}
setInterval(()=>{drawClock();if(A.role==='host'&&A.game)tickHost()},90);setInterval(()=>{if(A.role==='guest'&&A.conn?.open)A.conn.send({t:'ping',sent:Date.now()})},4000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});render();
})();
</script></body></html>
