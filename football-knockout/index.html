'<div class="card"><label>NUMELE TĂU</label><input id="name" class="field" placeholder="Ex: Hagi 10" maxlength="18" value="'+esc(A.name)+'"><button class="btn" id="create">＋ CREEAZĂ CAMERĂ</button><div class="divide">SAU INTRĂ LA PRIETENI</div><label>CODUL CAMEREI</label><input id="code" class="field" placeholder="Ex: AB72CD" maxlength="6" value="'+esc(A.room)+'"><button class="btn alt" id="join">INTRĂ CU COD →</button></div><p class="muted" style="text-align:center">2–10 jucători · Fără cont · Hostul ține pagina deschisă</p>'}
function lobby(g){return '<div style="text-align:center"><div class="eyebrow">CAMERA ESTE PREGĂTITĂ</div><h2>ADUNĂ-ȚI <span>ECHIPA.</span></h2><p class="muted">Trimite linkul prietenilor. Fiecare intră de pe telefon.</p><div class="roomcode">'+esc(A.room)+'</div><div class="btn-row"><button class="btn" id="copy">⧉ COPIAZĂ LINK</button><button class="btn alt" id="share">↗ TRIMITE LINK</button></div><div class="link">'+esc(url())+'</div></div><div class="card"><h3>LA MASĂ <span class="pill" style="float:right">'+g.players.length+'/10</span></h3><div class="players">'+g.players.map(player).join('')+'</div></div>'+
(A.role==='host'?'<button id="start" class="btn" '+(g.players.filter(p=>p.online).length<2?'disabled':'')+'>⚡ ÎNCEPE JOCUL</button>':'<div class="card muted" style="text-align:center">⏳ Așteptăm ca gazda să înceapă...</div>')+
'<p class="muted" style="text-align:center">Răspuns greșit / lipsă = eliminare. Dacă nimeni nu nimerește, toți continuă.</p>'}
function game(g){let me=g.players.find(p=>p.id===A.token),alive=g.players.filter(p=>p.alive).length,reveal=g.phase==='reveal',chosen=me?.answered?me.answer:(A.choiceRound===g.round?A.choice:null),ready=Date.now()>=g.from;
let opts=g.q.options.map((s,i)=>{let cl='answer'+(reveal?(i===g.q.correct?' good':chosen===i?' bad':' dim'):(chosen===i?' sel':''));let disabled=reveal||!me?.alive||me.answered||chosen!==null||!ready;return '<button class="'+cl+'" data-answer="'+i+'" '+(disabled?'disabled':'')+'><span class="letter">'+['A','B','C','D'][i]+'</span>'+esc(s)+(reveal&&i===g.q.correct?' ✓':'')+'</button>'}).join('');
return '<div class="meta"><div class="round">RUNDA '+g.round+'</div><div class="pill">⚽ '+alive+' ÎN JOC</div></div><div class="question"><div id="timer" class="clock"><div class="clockinner" id="secs">7</div></div><div class="topic">'+(g.q.tag==='RO'?'🇷🇴 FOTBAL ROMÂNESC':'🌍 FOTBAL INTERNAȚIONAL')+'</div><div class="qtext">'+esc(g.q.text)+'</div><div class="answers">'+opts+'</div><div class="note">'+(reveal?'Răspunsul corect este marcat cu verde.':!me?.alive?'Ai fost eliminat. Urmărește jocul.':chosen!==null?'Răspuns blocat. Așteaptă verdictul.':'Ai doar 7 secunde!')+'</div>'+(reveal?'<div class="result '+(g.allMiss?'red':'')+'">'+(g.allMiss?'NIMENI NU A NIMERIT — TOȚI CONTINUĂ':alive+' JUCĂTORI AU RĂMAS')+'</div>':'')+'</div><div class="card"><h3>LA MASĂ</h3><div class="players">'+g.players.map(player).join('')+'</div></div>'}
function finished(g){let p=g.players.find(p=>p.id===g.winner);return '<div class="card winner"><div class="eyebrow">CAMPIONUL SERII</div><div class="trophy">🏆</div><h2><span>KNOCKOUT!</span></h2><div class="winname">'+esc(p?.name||'CAMPIO​NUL')+'</div><p class="muted">Ultimul rămas după '+g.round+' runde.</p><div class="players">'+g.players.map(player).join('')+'</div>'+(A.role==='host'?'<button class="btn" id="replay">↻ REVANȘĂ</button>':'<p class="muted">Gazda poate porni o revanșă.</p>')+'</div>'}
function render(){let box=$('app');if(A.mode==='loading'){box.innerHTML='<div class="loading">⚽ Se conectează camera...</div>';return}
let html=A.mode==='home'||!A.state?home():A.state.phase==='lobby'?lobby(A.state):A.state.phase==='finished'?finished(A.state):game(A.state);
box.innerHTML=(A.err?'<div class="error">'+esc(A.err)+(A.role==='guest'&&A.mode==='room'?' <button id="reconnect" class="btn alt">RECONECTEAZĂ</button>':'')+'</div>':'')+html;
for(let [id,cb] of Object.entries({create:host,join,copy,share,start,replay,reconnect:connect})){let b=$(id);if(b)b.onclick=cb}
document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer));drawClock();
if(A.state?.phase==='finished'&&!A.won){A.won=true;try{navigator.vibrate?.([70,80,70])}catch(e){}}
}
function drawClock(){let g=A.state;if(!g||g.phase!=='question'&&g.phase!=='reveal')return;let s=g.phase==='question'?Math.max(0,Math.min(7,(g.deadline-Math.max(g.from,Date.now()))/1000)):0;let t=$('secs'),r=$('timer');if(t)t.textContent=g.phase==='reveal'?'✓':Math.ceil(s);if(r)r.style.background='conic-gradient('+(s<=2?'#ff726c':'#cafa54')+' '+s/7*360+'deg,#42674a 0)';if(g.phase==='question'&&Date.now()>=g.from){document.querySelectorAll('[data-answer]').forEach(b=>{let me=g.players.find(p=>p.id===A.token);if(me?.alive&&!me.answered&&A.choiceRound!==g.round)b.disabled=false})}}
setInterval(()=>{drawClock();if(A.role==='host'&&A.game)tickHost()},120);render();
})();
</script></body></html>
